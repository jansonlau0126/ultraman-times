<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>超人乘數表・光之巨人打怪獸</title>
<style>
:root{
  --font:"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK HK","Noto Sans CJK TC","Source Han Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hdr:56px;
  --panel:rgba(16,22,72,.82);
  --line:rgba(255,255,255,.16);
  --yellow:#ffd84d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1033}
body{font-family:var(--font);color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#bg .tw{animation:twinkle 3s ease-in-out infinite alternate}
#bg .sl{transform-box:view-box;animation:sweep 9s ease-in-out infinite alternate}
#bg .sl2{animation-duration:12s;animation-direction:alternate-reverse}
#bg .blinkred{animation:tblink 1.4s steps(2) infinite}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}

#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#topbar{height:var(--hdr);flex:0 0 var(--hdr);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
.brand{font-weight:900;font-size:22px;letter-spacing:2px;color:#fff;text-shadow:0 2px 0 #b91c1c,0 0 12px rgba(255,120,120,.6)}
.brand small{font-size:13px;opacity:.8;letter-spacing:0;margin-left:6px;text-shadow:none}
body[data-screen="home"] .brand,body[data-screen="home"] #btnHome{visibility:hidden}
.iconbtn{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0}
.iconbtn svg{width:26px;height:26px}
.iconbtn:active{transform:scale(.92)}
svg.ic{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 12px 16px}
.screen.active{display:flex;flex-direction:column;align-items:center;animation:screenIn .35s ease-out}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
h2.h{font-size:clamp(26px,6vw,40px);margin:6px 0 4px;font-weight:900;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35)}
p.sub{margin:0 0 12px;font-size:clamp(16px,3.8vw,20px);opacity:.9;text-align:center}

/* chunky buttons */
.btn{--c1:#ff5b5b;--c2:#d61f1f;--c3:#8f0f0f;border:0;border-radius:20px;padding:14px 22px;font-size:clamp(20px,4.6vw,26px);font-weight:900;color:#fff;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--c3),0 10px 18px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c3),0 4px 8px rgba(0,0,0,.35)}
.btn[disabled]{filter:grayscale(.8) brightness(.8);cursor:not-allowed}
.btn svg{width:28px;height:28px}
.btn.blue{--c1:#4fb3ff;--c2:#1d6fe0;--c3:#0f3e8a}
.btn.green{--c1:#5ee07a;--c2:#1fa845;--c3:#0e6428}
.btn.orange{--c1:#ffb547;--c2:#f07a12;--c3:#9a4604}
.btn.purple{--c1:#b58cff;--c2:#7c3aed;--c3:#4c1d95}
.btn.gray{--c1:#8b95b5;--c2:#56608a;--c3:#2f3656}
.btn.small{font-size:18px;padding:10px 16px;min-height:46px;border-radius:16px}

/* HOME — raster concept-style art + glass pill UI */
#home{overflow:hidden;padding:0}
body[data-screen="home"] #bg{opacity:0;pointer-events:none}
body[data-screen="home"] #topbar{position:absolute;inset:0 0 auto 0;z-index:5;background:transparent;pointer-events:none}
body[data-screen="home"] #topbar .iconbtn{pointer-events:auto}
body[data-screen="home"] main{padding-top:0}
.home-city{position:absolute;inset:0;z-index:0;background:#0a0e2e center/cover no-repeat;background-image:url('assets/home/city_bg.jpg')}
#home .home-glow{pointer-events:none;position:absolute;inset:0;z-index:1;background:
  radial-gradient(ellipse at 50% 32%,rgba(60,160,255,.22),transparent 50%),
  radial-gradient(ellipse at 50% 100%,rgba(5,8,24,.55),transparent 45%)}
.home-wrap{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 4px) 10px 6px;box-sizing:border-box;gap:0}
.home-title{flex:0 0 auto;font-size:clamp(38px,9.5vw,72px);font-weight:900;line-height:1.02;margin:0;letter-spacing:4px;text-align:center;
  background:linear-gradient(180deg,#ffb06a 0%,#ff5a3a 42%,#e01818 78%,#9a0c0c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #4a0808) drop-shadow(0 5px 0 #2a0404) drop-shadow(0 0 14px rgba(255,70,40,.4))}
.home-stage{position:relative;flex:1 1 auto;width:100%;max-width:720px;min-height:0;margin:0;display:flex;align-items:flex-end;justify-content:center}
.home-hero{position:relative;height:min(100%,64vh);width:auto;aspect-ratio:15/16;cursor:pointer;z-index:3;margin-bottom:-8%;filter:drop-shadow(0 0 24px rgba(80,230,255,.55)) drop-shadow(0 14px 20px rgba(0,0,0,.4))}
.home-hero .hero-bob{animation:homeFloat 2.8s ease-in-out infinite;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.home-hero-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;pointer-events:none;user-select:none}
@keyframes homeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
.home-sparkles{position:absolute;inset:6% 10% 18%;pointer-events:none;z-index:4}
.home-sparkles i{position:absolute;width:12px;height:12px;background:#ffe66d;clip-path:polygon(50% 0,61% 35%,100% 50%,61% 65%,50% 100%,39% 65%,0 50%,39% 35%);animation:spark 1.6s ease-in-out infinite;opacity:.9}
.home-sparkles i:nth-child(1){left:4%;top:16%;width:16px;height:16px;animation-delay:0s}
.home-sparkles i:nth-child(2){right:6%;top:10%;width:18px;height:18px;background:#ffe66d;animation-delay:.3s}
.home-sparkles i:nth-child(3){left:12%;bottom:20%;width:11px;height:11px;background:#ffe66d;animation-delay:.6s}
.home-sparkles i:nth-child(4){right:12%;bottom:16%;width:14px;height:14px;background:#ff7ad9;animation-delay:.9s}
.home-sparkles i:nth-child(5){left:46%;top:4%;width:10px;height:10px;background:#fff;animation-delay:.2s}
@keyframes spark{0%,100%{transform:scale(.7) rotate(0);opacity:.45}50%{transform:scale(1.3) rotate(18deg);opacity:1}}
.home-dock{position:relative;flex:0 0 auto;width:100%;max-width:980px;display:grid;grid-template-columns:minmax(70px,1fr) minmax(0,480px) minmax(70px,1fr);align-items:end;gap:2px 6px;padding:0 4px 0;z-index:4;margin-top:-2%}
.home-dock::before{content:"";position:absolute;left:3%;right:3%;bottom:0;height:20px;border-radius:40% 40% 0 0;background:linear-gradient(180deg,rgba(8,10,28,.15),rgba(4,6,18,.5));pointer-events:none;z-index:0}
.home-menu{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;z-index:2;padding-bottom:8px}
.home-pet{width:clamp(92px,16vw,148px);aspect-ratio:1;z-index:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));align-self:end;margin-bottom:0}
.home-pet-l{grid-column:1;justify-self:start;animation:bob 2.4s ease-in-out infinite}
.home-pet-r{grid-column:3;justify-self:end;animation:bob 2.1s ease-in-out infinite alternate}
.home-pet .mon-bob{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.home-pet-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;pointer-events:none;user-select:none}
.home-floor-stars{position:absolute;left:0;right:0;bottom:2px;height:28px;pointer-events:none;z-index:3}
.home-floor-stars i{position:absolute;bottom:4px;width:10px;height:10px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark 1.8s ease-in-out infinite}
.home-floor-stars i:nth-child(1){left:8%;background:#ffe66d}
.home-floor-stars i:nth-child(2){left:18%;background:#ff7ad9;width:8px;height:8px;animation-delay:.4s}
.home-floor-stars i:nth-child(3){left:28%;background:#ffe66d;width:7px;height:7px;animation-delay:.8s}
.home-floor-stars i:nth-child(4){right:28%;background:#ffe66d;width:7px;height:7px;animation-delay:.2s}
.home-floor-stars i:nth-child(5){right:18%;background:#ff7ad9;width:9px;height:9px;animation-delay:.6s}
.home-floor-stars i:nth-child(6){right:8%;background:#ffe66d;animation-delay:1s}
.home-pill{position:relative;border:3.5px solid rgba(255,255,255,.92);border-radius:999px;min-width:0;width:100%;min-height:clamp(50px,7.5vh,66px);padding:10px 14px;font-weight:900;font-size:clamp(16px,3.6vw,24px);color:#fff;letter-spacing:1px;
  box-shadow:0 7px 0 rgba(0,0,0,.3),0 12px 22px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;overflow:hidden}
.home-pill::after{content:"";position:absolute;left:10%;right:10%;top:10%;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.home-pill:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.45)}
.home-pill{min-height:clamp(42px,6.2vh,58px);padding:8px 10px;font-size:clamp(15px,3.2vw,22px)}
.home-pill.learn{background:linear-gradient(180deg,#9ad4ff 0%,#3b82f6 48%,#1d4ed8 100%)}
.home-pill.battle{background:linear-gradient(180deg,#8dffb8 0%,#22c55e 48%,#15803d 100%);min-height:clamp(46px,6.6vh,62px);font-size:clamp(16px,3.5vw,24px)}
.home-pill.divide{background:linear-gradient(180deg,#d8b4fe 0%,#7c3aed 48%,#5b21b6 100%)}
.home-pill.mixed{background:linear-gradient(180deg,#ffe08a 0%,#f59e0b 48%,#b45309 100%);color:#3b1d00;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.home-pill.timed{background:linear-gradient(180deg,#ffa0c0 0%,#f43f5e 48%,#be123c 100%)}
.home-pill.combo{background:linear-gradient(180deg,#7ee7ff 0%,#2563eb 46%,#6d28d9 100%)}
.home-record{flex:0 0 auto;margin:2px 0 4px;min-width:min(92vw,460px);min-height:clamp(56px,8.4vh,72px);padding:8px 28px 10px;border-radius:999px;border:3.5px solid rgba(255,255,255,.95);background:linear-gradient(180deg,#ffe98a 0%,#f5b942 46%,#d97706 100%);color:#3b1d00;font-weight:900;font-size:clamp(24px,5.2vw,32px);letter-spacing:3px;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 6px 0 #92400e,0 12px 22px rgba(0,0,0,.32),inset 0 3px 0 rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;z-index:3;cursor:pointer}
.home-record small{display:block;font-size:.4em;font-weight:800;letter-spacing:1px;opacity:.82;margin-top:2px}
.home-record:active{transform:translateY(4px);box-shadow:0 2px 0 #92400e,inset 0 2px 0 rgba(255,255,255,.5)}
.stage-chip{display:flex;align-items:center;justify-content:center;gap:4px;flex:0 0 auto;margin:4px 0 0;z-index:4}
.stage-chip span{font-size:12px;font-weight:900;letter-spacing:1px;color:#e8ecff}
.stage-chip button{border:2px solid rgba(255,255,255,.55);background:rgba(8,12,40,.62);color:#fff;border-radius:999px;padding:2px 9px;font-weight:900;font-size:12px;line-height:1.2;min-height:28px}
.stage-chip button.on{background:#ffd84d;color:#3b2300;border-color:#fff}
.stage-chip.setup-stage{margin:4px 0 8px}
#home .stage-chip{margin-top:2px}
@media (max-width:640px){
  .home-hero{height:min(100%,54vh);margin-bottom:-4%}
  .home-dock{grid-template-columns:minmax(48px,.55fr) minmax(0,1fr) minmax(48px,.55fr);gap:2px}
  .home-menu{gap:6px}
  .home-pill{padding:7px 6px;font-size:clamp(13px,3.4vw,16px);min-height:40px}
  .home-pill.battle{font-size:clamp(14px,3.6vw,17px);min-height:42px}
  .home-pet{width:clamp(64px,18vw,96px)}
  .home-wrap{padding-bottom:8px}
  .home-record{min-height:50px;margin:0;font-size:clamp(20px,5.6vw,28px);padding:4px 18px 6px}
  #home .stage-chip{margin-top:2px}
  #home .stage-chip button{min-height:24px;font-size:11px;padding:1px 8px}
}
@media (orientation:landscape) and (max-height:520px){
  .home-title{font-size:clamp(26px,6.5vw,44px)}
  .home-hero{height:min(100%,50vh)}
  .home-pill{min-height:34px;font-size:clamp(13px,2.6vw,16px);padding:4px 6px}
  .home-pill.battle{min-height:36px}
  .home-pet{width:clamp(56px,12vw,90px)}
  .home-record{min-height:46px;font-size:clamp(18px,3.4vw,24px);padding:4px 18px 6px;letter-spacing:2px}
}
/* legacy title/menu kept for other screens */ 
.title{font-size:clamp(48px,13vw,96px);font-weight:900;line-height:1.05;margin:4px 0 0;letter-spacing:4px;background:linear-gradient(180deg,#fffbd1 0%,#ffe14d 45%,#ff9d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 0 0 #c01616) drop-shadow(-3px 0 0 #c01616) drop-shadow(0 3px 0 #c01616) drop-shadow(0 -3px 0 #c01616) drop-shadow(0 7px 0 #6b0909) drop-shadow(0 0 22px rgba(255,210,80,.55));text-align:center}
.tagline{font-size:clamp(17px,4.2vw,24px);font-weight:900;margin:8px 0 2px;color:#bfe9ff;text-shadow:0 2px 0 #1b2a7a;text-align:center}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:620px}
.menu .btn{flex-direction:column;gap:2px;min-height:112px;padding:10px 8px;border-radius:24px}
.menu .btn svg{width:40px;height:40px;margin-bottom:2px}
.menu .btn small{font-size:clamp(13px,3.3vw,16px);font-weight:700;opacity:.95}

/* figures */
.hero,.mon{width:100%;height:100%;display:block;overflow:visible}
.hero-bob,.mon-bob{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
/* Scale from the feet so fighters stay inside the shorter battle stage. */
#battle{--pop:1.05}
#battle .mon-bob{transform-origin:50% 100%;animation:battlePop 2.4s ease-in-out infinite}
@keyframes battlePop{0%,100%{transform:translateY(0) scale(var(--pop,1.2))}50%{transform:translateY(-3%) scale(var(--pop,1.2))}}
.hero{transform-origin:50% 100%}
.hero .h-armL,.hero .h-armR{transform-box:view-box;transition:transform .16s ease-out}
.hero .h-armL{transform-origin:70px 130px}
.hero .h-armR{transform-origin:150px 130px}
.hero .h-cross,.hero .h-kick,.hero .h-aura,.hero .h-discghost,
.hero .h-mark-red,.hero .h-mark-blue,.hero .h-collar,
.hero .h-cape-red,.hero .h-cape-blue,.hero .h-cape-gold,
.hero .h-gold-aura,.hero .h-halo,.hero .h-wings{display:none}
.hero.pose-beam .h-armL,.hero.pose-beam .h-armR{display:none}
.hero.pose-beam .h-cross{display:inline}
.hero.pose-beam{transform:rotate(-6deg) translateX(4px)}
.hero.pose-kick .h-legR{display:none}
.hero.pose-kick .h-kick{display:inline}
.hero.pose-kick .h-armL{transform:rotate(55deg)}
.hero.pose-kick .h-armR{transform:rotate(-80deg)}
.hero.pose-kick{transform:rotate(-8deg) translate(4px,-2px)}
.hero.pose-disc .h-armR{transform:rotate(-160deg)}
.hero.pose-disc .h-armL{transform:rotate(24deg)}
.hero.pose-disc{transform:rotate(3deg)}
.hero.pose-punch .h-armR{transform:rotate(-95deg)}
.hero.pose-punch .h-armL{transform:rotate(30deg)}
.hero.pose-punch{transform:translateX(6px) rotate(-3deg)}
.hero.pose-win .h-armR{transform:rotate(-155deg)}
.hero.pose-win .h-armL{transform:rotate(28deg)}
.hero.pose-win{transform:translateY(-2px)}
.hero.aura .h-aura{display:inline;animation:aura .25s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.45}to{opacity:.95}}
/* Five-stage henshin — final chibi cast */
.hero.henshin-2 .h-mark-red,.hero.henshin-4 .h-mark-red,.hero.henshin-5 .h-mark-red{display:inline}
.hero.henshin-2 .h-collar,.hero.henshin-3 .h-collar,.hero.henshin-4 .h-collar,.hero.henshin-5 .h-collar{display:inline}
.hero.henshin-3 .h-mark-blue{display:inline}
.hero.henshin-3 .h-mark-red{display:none}
.hero.henshin-3 .h-cape-blue{display:inline}
.hero.henshin-4 .h-cape-gold{display:inline}
.hero.henshin-4 .h-gold-aura{display:inline}
.hero.henshin-5 .h-wings,.hero.henshin-5 .h-halo{display:inline}
.hero.henshin-2 .h-aura{display:inline;opacity:.45;fill:#9ee7ff}
.hero.henshin-3 .h-aura{display:inline;opacity:.6;fill:#7ff0ff}
.hero.henshin-4 .h-aura{display:inline;opacity:.8;fill:#ffe066;animation:aura .2s ease-in-out infinite alternate,rbfill .8s linear infinite}
.hero.henshin-5 .h-aura{display:inline;opacity:.9;fill:#ffe066;animation:aura .18s ease-in-out infinite alternate,rbfill .45s linear infinite}
.hero.henshin-4 .h-gold-aura{animation:mfloat 1s ease-in-out infinite alternate}
.hero.henshin-5 .h-wings{animation:icflap 1.4s ease-in-out infinite alternate}
.hero.henshin-5 .h-halo{animation:aura .8s ease-in-out infinite alternate}
.hero.henshin-4{filter:drop-shadow(0 0 10px rgba(255,220,80,.45))}
.hero.henshin-5{filter:drop-shadow(0 0 14px rgba(127,240,255,.55))}
.hero.henshin-up{filter:brightness(1.55) drop-shadow(0 0 16px rgba(255,255,255,.9))}
.hero.pose-kick .h-cape-red,.hero.pose-beam .h-cape-red,.hero.pose-punch .h-cape-red,.hero.pose-win .h-cape-red{display:inline;opacity:.9}
.hero .h-eyeglow{animation:eyeglow 1.8s ease-in-out infinite alternate}
@keyframes eyeglow{from{opacity:.45}to{opacity:1}}
.hero .h-timer,.hero .h-tglow{fill:var(--tc,#5ee7ff);transition:fill .3s}
.hero.t-blink .h-timer,.hero.t-blink .h-tglow{animation:tblink .7s steps(2,jump-none) infinite}
.hero.combo-rainbow .h-tglow{animation:rbfill .55s linear infinite,tblink .55s steps(2,jump-none) infinite}
.hero.combo-omega .h-tglow,.hero.combo-omega .h-timer{animation:rbfill .35s linear infinite,tblink .4s steps(2,jump-none) infinite}
.hero.charging{filter:brightness(1.45) drop-shadow(0 0 12px rgba(255,255,255,.85))}
.hero.charging .h-aura{display:inline;opacity:.9}
@keyframes tblink{0%{opacity:1}100%{opacity:.2}}
.mon .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.mon .m-ouch{display:none}
.mon.ouch .m-eyes{display:none}
.mon.ouch .m-ouch{display:inline}
.mon .m-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .3s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(1.06,.9)}}
.mon .m-float{animation:mfloat 2s ease-in-out infinite alternate}
@keyframes mfloat{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.mon-ice .ic-wing{transform-box:view-box;transform-origin:120px 120px;animation:icflap 2.4s ease-in-out infinite alternate}
@keyframes icflap{from{transform:scaleY(1)}to{transform:scaleY(1.06) translateY(-3px)}}
.mon-thunder .thun-cloak{animation:thcloak 4.5s ease-in-out infinite}
@keyframes thcloak{0%,70%,100%{opacity:1}80%{opacity:.22}90%{opacity:.85}}

/* BATTLE stage height is a playtest choice. Question stays in the panel below the stage.
   A 緊湊 ~32dvh (most room for the sum), B 適中 ~41dvh (default), C 大戰鬥 ~49dvh. */
#battle{padding:2px 8px 6px;--stage-row:minmax(128px,41dvh)}
#battle.stage-a{--stage-row:minmax(108px,32dvh)}
#battle.stage-b{--stage-row:minmax(128px,41dvh)}
#battle.stage-c{--stage-row:minmax(148px,49dvh)}
#battle.active{display:grid;grid-template-rows:var(--stage-row) minmax(0,1fr);gap:6px;align-items:stretch;height:100%;overflow:hidden}
@media (max-height:700px){
  #battle.stage-a{--stage-row:minmax(96px,28dvh)}
  #battle.stage-b{--stage-row:minmax(108px,34dvh)}
  #battle.stage-c{--stage-row:minmax(120px,40dvh)}
}
@media (max-height:620px){
  #battle.stage-a{--stage-row:minmax(88px,24dvh)}
  #battle.stage-b{--stage-row:minmax(96px,30dvh)}
  #battle.stage-c{--stage-row:minmax(104px,34dvh)}
}
@media (orientation:landscape) and (min-width:700px){
  #battle.active{grid-template-columns:minmax(0,1.05fr) minmax(300px,1fr);grid-template-rows:minmax(0,1fr)}
}
.stage{position:relative;border-radius:24px;overflow:hidden;min-height:0;border:3px solid var(--line);background:linear-gradient(180deg,rgba(20,20,80,.05) 0%,rgba(40,20,90,.25) 70%,rgba(0,0,0,0) 100%);z-index:1}
.battle-city{position:absolute;inset:0;z-index:0;background:#0a0e2e center/cover no-repeat;background-image:url('assets/home/city_bg.jpg');opacity:.92}
.ground{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(20,24,48,.75),rgba(8,10,24,.9));border-top:3px solid rgba(93,106,160,.55);z-index:1}
.ground::after{content:"";position:absolute;left:0;right:0;top:38%;height:4px;background:repeating-linear-gradient(90deg,#ffd84d 0 28px,transparent 28px 60px);opacity:.55}
.hero-wrap{position:absolute;left:2%;bottom:12%;z-index:3;overflow:visible}
.mon-wrap{position:absolute;right:2%;bottom:12%;z-index:2;overflow:visible}
/* Beam pose art and the omega move reach across the monster. Drop that hero
   under the monster. Other poses stay in front. Full opacity either way. */
.hero-wrap.under-mon{z-index:2}
.hero-wrap.under-mon ~ .mon-wrap{z-index:4}
.hero.raster{position:relative;width:100%;height:100%;display:block}
.hero-art{position:absolute;inset:0}
.hero-raster,.mon-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;pointer-events:none;user-select:none}
.hero-art .hero-raster{position:absolute;inset:0}
.hero-raster.hero-fade{z-index:2;opacity:1;transition:opacity .48s ease}
.hero-raster.hero-fade.out{opacity:0}
.hero-anchors,.mon-anchors{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
/* Painted poses already show the action. Don't rotate the PNG on top. Lunge stays on .hero-wrap. */
.hero.raster.pose-beam,
.hero.raster.pose-kick,
.hero.raster.pose-disc,
.hero.raster.pose-punch,
.hero.raster.pose-win,
.hero.raster.pose-tuck,
.hero.raster.pose-guard,
.hero.raster.pose-omega,
.hero.raster.pose-flip,
.hero.raster.pose-whirl,
.hero.raster.pose-super,
.hero.raster.pose-rainbow{transform:none}
/* Hero canvas has empty space under the feet. Drop each form/pose so the feet meet the monster on the ground line.
   --pop scales the pose from that same foot line (translate grows with the scale). */
.hero.raster .hero-art{transform-origin:50% 100%;transform:translateY(calc(22% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-1 .hero-art,.hero.raster.henshin-4 .hero-art{transform:translateY(calc(23% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.pose-punch .hero-art,
.hero.raster.pose-disc .hero-art,
.hero.raster.pose-whirl .hero-art,
.hero.raster.pose-rainbow .hero-art{transform:translateY(calc(22% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-1.pose-punch .hero-art,
.hero.raster.henshin-1.pose-disc .hero-art,
.hero.raster.henshin-1.pose-whirl .hero-art,
.hero.raster.henshin-1.pose-rainbow .hero-art,
.hero.raster.henshin-2.pose-punch .hero-art,
.hero.raster.henshin-2.pose-disc .hero-art,
.hero.raster.henshin-2.pose-whirl .hero-art,
.hero.raster.henshin-2.pose-rainbow .hero-art{transform:translateY(calc(21% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.pose-kick .hero-art,
.hero.raster.pose-flip .hero-art{transform:translateY(calc(23% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-1.pose-kick .hero-art,
.hero.raster.henshin-1.pose-flip .hero-art{transform:translateY(calc(24% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-4.pose-kick .hero-art,
.hero.raster.henshin-4.pose-flip .hero-art{transform:translateY(calc(15% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.pose-guard .hero-art{transform:translateY(calc(22% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-3.pose-guard .hero-art{transform:translateY(calc(10% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-5.pose-guard .hero-art{transform:translateY(calc(12% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.pose-beam .hero-art,
.hero.raster.pose-super .hero-art{transform:translateY(calc(17% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-2.pose-beam .hero-art,
.hero.raster.henshin-2.pose-super .hero-art{transform:translateY(calc(22% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-3.pose-beam .hero-art,
.hero.raster.henshin-3.pose-super .hero-art{transform:translateY(calc(9% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-4.pose-beam .hero-art,
.hero.raster.henshin-4.pose-super .hero-art{transform:translateY(calc(10% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.pose-win .hero-art{transform:translateY(calc(9% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-3.pose-win .hero-art{transform:translateY(calc(8% * var(--pop, 1))) scale(var(--pop, 1))}
.hero.raster.henshin-5.pose-win .hero-art{transform:translateY(calc(7% * var(--pop, 1))) scale(var(--pop, 1))}
/* hero_h{N}.png is a tight portrait, not the padded 520 square. Scale it so the
   standing body stays the same height inside the pose box, feet on the ground. */
.hero.raster.henshin-1{--body:.50}
.hero.raster.henshin-2{--body:.56}
.hero.raster.henshin-3{--body:.54}
.hero.raster.henshin-4{--body:.55}
.hero.raster.henshin-5{--body:.56}
.hero.raster.stand .hero-art,
.hero.raster.henshin-1.stand .hero-art,
.hero.raster.henshin-4.stand .hero-art{transform:scale(var(--body,.52));transform-origin:50% 100%}
.form-name{position:absolute;left:50%;top:100%;margin-top:1px;transform:translateX(-50%);z-index:9;pointer-events:none;white-space:nowrap;font-weight:900;font-size:clamp(13px,3.1vw,18px);line-height:1.15;letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#38bdf8,#0369a1);border:2px solid #fff;border-radius:999px;padding:2px 10px;box-shadow:0 3px 0 #082f49,0 0 10px rgba(56,189,248,.65);text-shadow:0 1px 0 #082f49}

.impact svg{position:absolute;inset:0;width:100%;height:100%}
.impact span{position:relative;font-weight:900;font-size:36px;color:#fff;text-shadow:2px 2px 0 #c01616,-2px -2px 0 #c01616,2px -2px 0 #c01616,-2px 2px 0 #c01616,0 5px 0 #6b0909}
.dmg{position:absolute;font-weight:900;font-size:clamp(26px,6vw,40px);color:#fff;text-shadow:2px 2px 0 #c01616,-2px -2px 0 #c01616,2px -2px 0 #c01616,-2px 2px 0 #c01616;white-space:nowrap}
.yell{position:absolute;font-weight:900;font-size:clamp(28px,7vw,48px);color:#ffe14d;text-shadow:3px 3px 0 #c01616,-3px -3px 0 #c01616,3px -3px 0 #c01616,-3px 3px 0 #c01616,0 0 18px rgba(255,255,255,.9);white-space:nowrap;letter-spacing:2px}
.ouchtxt{position:absolute;font-weight:900;font-size:clamp(20px,4.5vw,30px);color:#ffe14d;text-shadow:2px 2px 0 #1e3a8a,-2px -2px 0 #1e3a8a,2px -2px 0 #1e3a8a,-2px 2px 0 #1e3a8a;white-space:nowrap}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.speedline{position:absolute;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff);opacity:.8}

.panel{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;min-width:0;min-height:0;position:relative;overflow:hidden;z-index:4}
.qcard{position:relative;flex:0 0 auto;border-radius:18px;padding:10px 8px 12px;overflow:hidden;z-index:1;background:rgba(6,10,36,.55);border:3px solid rgba(255,216,77,.88);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.qcard.eh .qrow{text-shadow:0 2px 0 #0b1033,0 0 8px rgba(0,0,0,.7)}
.qcard .qrow{position:relative;z-index:3}
.elem-pop{position:absolute;left:50%;top:18%;z-index:8;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;font-weight:900;font-size:clamp(42px,10vw,72px);line-height:1.15;letter-spacing:2px;padding:.08em .2em .12em;-webkit-text-stroke:5px #1a0a00;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 16px currentColor;white-space:nowrap;color:#fff;overflow:visible}
.elem-pop.pop-fire{color:#ffeb3b}
.elem-pop.pop-ice{color:#e0f7ff;-webkit-text-stroke-color:#0c4a6e}
.elem-pop.pop-thunder{color:#fff36a;-webkit-text-stroke-color:#713f12}
.elem-pop.pop-poison{color:#d8b4fe;-webkit-text-stroke-color:#3b0764}
.elem-pop.pop-rock{color:#e7e5e4;-webkit-text-stroke-color:#44403c}
.elem-pop.pop-sand{color:#fde047;-webkit-text-stroke-color:#713f12}
.elem-pop.pop-steel{color:#f8fafc;-webkit-text-stroke-color:#334155}
.elem-pop.pop-water{color:#7dd3fc;-webkit-text-stroke-color:#0c4a6e}
.elem-pop.pop-dark{color:#d8b4fe;-webkit-text-stroke-color:#1e1b4b}
.elem-pop.pop-light{color:#fff;-webkit-text-stroke-color:#b45309}
.elem-pop.pop-star{color:#fde68a;-webkit-text-stroke-color:#4c1d95}
.elem-pop.show{animation:elemPop 1.05s ease-out}
@keyframes elemPop{0%{opacity:0;transform:translate(-50%,-8%) scale(.18) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-42%) scale(1.12) rotate(3deg)}58%{opacity:1;transform:translate(-50%,-42%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.06)}}
.ebit{position:absolute;pointer-events:none;z-index:4;border-radius:50%}
.ebit-fire{width:16px;height:16px;background:radial-gradient(circle,#fff 0 20%,#ffb020 40%,#ff3b00 70%,transparent 72%);box-shadow:0 0 10px #ff6a00;animation:bitUp .9s ease-out forwards}
.ebit-ice{width:12px;height:12px;background:#fff;box-shadow:0 0 8px #bae6fd;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:bitFall 1s linear forwards}
.ebit-thunder{width:6px;height:28px;border-radius:2px;background:linear-gradient(#fff,#fde047);box-shadow:0 0 10px #fde047;transform:rotate(18deg);animation:bitZap .45s steps(2) infinite}
.ebit-poison{width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#f5d0fe,#a855f7 60%,transparent 62%);animation:bitUp 1s ease-out forwards}
.ebit-rock{width:14px;height:10px;border-radius:3px;background:#a8a29e;box-shadow:1px 1px 0 #44403c;animation:bitFall .9s ease-in forwards}
.ebit-sand{width:10px;height:10px;background:#facc15;animation:bitDrift 1s linear forwards}
.ebit-steel{width:8px;height:8px;background:#fff;box-shadow:0 0 6px #e2e8f0;transform:rotate(45deg);animation:bitUp .8s ease-out forwards}
.ebit-water{width:22px;height:10px;border-radius:10px;background:rgba(56,189,248,.85);animation:bitDrift 1s ease-out forwards}
.ebit-dark{width:28px;height:28px;background:rgba(20,0,40,.72);filter:blur(1px);animation:bitUp 1s ease-out forwards}
.ebit-light{width:18px;height:18px;background:#fff;box-shadow:0 0 16px #fff;animation:bitZap .5s ease-out forwards}
.ebit-star{width:14px;height:14px;background:#fde68a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:bitFall 1s linear forwards}
@keyframes bitUp{from{transform:translateY(8px) scale(.4);opacity:1}to{transform:translateY(-36px) scale(1.2);opacity:0}}
@keyframes bitFall{from{transform:translateY(-16px);opacity:1}to{transform:translateY(28px) rotate(40deg);opacity:0}}
@keyframes bitDrift{from{transform:translateX(-12px);opacity:.2}to{transform:translateX(30px);opacity:0}}
@keyframes bitZap{0%,100%{opacity:1}50%{opacity:.15}}
.qcard.eh{border-radius:18px}
.qcard.eh-fire{animation:ehBurn 1.05s ease-out;background:linear-gradient(180deg,rgba(255,180,40,.15),rgba(255,50,0,.72));box-shadow:inset 0 0 0 5px #ff6a00,inset 0 -28px 0 rgba(255,60,0,.55),0 0 24px rgba(255,80,0,.65)}
.qcard.eh-fire.shade-black{background:linear-gradient(180deg,rgba(40,0,0,.2),rgba(80,0,0,.78));box-shadow:inset 0 0 0 5px #7f1d1d,inset 0 0 40px rgba(255,40,0,.45)}
.qcard.eh-ice{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(125,211,252,.55));box-shadow:inset 0 0 0 5px #e0f2fe,inset 0 0 28px #fff}
.qcard.eh-ice::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:
  radial-gradient(circle at 12% 20%,#fff 0 7px,transparent 8px),
  radial-gradient(circle at 70% 16%,#fff 0 5px,transparent 6px),
  radial-gradient(circle at 40% 70%,#fff 0 6px,transparent 7px),
  linear-gradient(135deg,rgba(255,255,255,.55),transparent 42%);
  animation:ehFrost 1.05s ease-out}
.qcard.eh-thunder{background:linear-gradient(180deg,rgba(255,250,180,.2),rgba(250,204,21,.35));box-shadow:inset 0 0 0 5px #fde047,0 0 28px rgba(250,204,21,.8);animation:ehZap 1.05s linear}
.qcard.eh-poison{background:
  radial-gradient(circle at 18% 72%,rgba(168,85,247,.85) 0 14px,transparent 16px),
  radial-gradient(circle at 74% 36%,rgba(192,132,252,.9) 0 18px,transparent 20px),
  radial-gradient(circle at 48% 80%,rgba(74,222,128,.8) 0 12px,transparent 14px),
  linear-gradient(180deg,rgba(88,28,135,.25),rgba(22,101,52,.45));
  box-shadow:inset 0 0 0 5px #c084fc}
.qcard.eh-poison.shade-vine{box-shadow:inset 0 0 0 5px #22c55e,inset 0 -18px 0 rgba(21,128,61,.55)}
.qcard.eh-rock{animation:cardShake .28s linear 3;background:
  radial-gradient(circle at 16% 78%,#78716c 0 9px,transparent 10px),
  radial-gradient(circle at 72% 70%,#57534e 0 12px,transparent 13px),
  radial-gradient(circle at 46% 88%,#a8a29e 0 7px,transparent 8px),
  linear-gradient(180deg,transparent,rgba(68,64,60,.55));
  box-shadow:inset 0 0 0 5px #a8a29e}
.qcard.eh-sand{background:repeating-linear-gradient(100deg,rgba(250,204,21,.15) 0 8px,rgba(202,138,4,.55) 8px 14px);box-shadow:inset 0 0 36px rgba(250,204,21,.85),inset 0 0 0 5px #eab308;animation:ehDust 1.05s linear}
.qcard.eh-sand::after{content:"";position:absolute;inset:0;background:rgba(250,204,21,.45);z-index:2;pointer-events:none;animation:ehDim 1.05s ease-out}
.qcard.eh-steel{background:repeating-linear-gradient(115deg,transparent 0 8px,rgba(255,255,255,.55) 8px 11px),linear-gradient(180deg,rgba(226,232,240,.35),rgba(100,116,139,.45));box-shadow:inset 0 0 0 5px #e5e7eb,0 0 16px rgba(255,255,255,.4)}
.qcard.eh-water{overflow:hidden;background:linear-gradient(180deg,rgba(14,165,233,.15),rgba(37,99,235,.35));box-shadow:inset 0 0 0 5px #38bdf8}
.qcard.eh-water::before{content:"";position:absolute;left:-30%;right:-30%;height:70%;bottom:-20%;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(56,189,248,.75) 42%,rgba(14,165,233,.2));border-radius:46% 54% 0 0;animation:ehWave 1.05s ease-out;pointer-events:none}
.qcard.eh-dark{animation:ehDim 1.05s ease-in-out;background:rgba(8,0,20,.72);box-shadow:inset 0 0 40px rgba(88,28,135,.8),inset 0 0 0 5px #6b21a8}
.qcard.eh-light{animation:ehFlash 1.05s ease-out;box-shadow:inset 0 0 0 6px #fff,0 0 30px #fff}
.qcard.eh-star{background:
  radial-gradient(circle at 18% 30%,#fff 0 3px,transparent 4px),
  radial-gradient(circle at 70% 22%,#fde68a 0 4px,transparent 5px),
  radial-gradient(circle at 40% 68%,#fff 0 3px,transparent 4px),
  radial-gradient(circle at 82% 64%,#c4b5fd 0 4px,transparent 5px),
  radial-gradient(circle at 55% 40%,#fff 0 2px,transparent 3px);
  box-shadow:inset 0 0 0 5px #fde68a,0 0 18px rgba(253,224,71,.6);animation:ehDust 1.05s linear}
@keyframes ehBurn{0%{filter:brightness(1)}25%{filter:brightness(1.45)}100%{filter:brightness(1.05)}}
@keyframes ehFrost{0%{filter:saturate(1)}40%{filter:saturate(.55) brightness(1.35)}100%{filter:none}}
@keyframes ehZap{0%,100%{filter:none}12%{filter:brightness(2.4)}18%{filter:none}40%{filter:brightness(1.9)}48%{filter:none}70%{filter:brightness(2.1)}}
@keyframes ehDust{0%{filter:contrast(1)}40%{filter:contrast(1.3) saturate(1.4)}100%{filter:none}}
@keyframes ehWave{0%{transform:translateX(-40%) translateY(55%)}100%{transform:translateX(22%) translateY(-28%)}}
@keyframes ehDim{0%,100%{filter:none}40%{filter:brightness(.35)}}
@keyframes ehFlash{0%{background:transparent}12%{background:rgba(255,255,255,.95)}40%{background:rgba(255,255,255,.35)}100%{background:transparent}}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
#choices.eh .choice{position:relative;overflow:hidden}
#choices.eh-fire .choice:not(.eh-ok){background:linear-gradient(180deg,#ffd36a,#ff4d00 58%,#7f1d1d);box-shadow:0 0 16px #ff6a00,inset 0 -14px 0 rgba(255,40,0,.75);animation:ehBurn .4s ease-in-out infinite alternate}
#choices.eh-ice .choice:not(.eh-ok){background:linear-gradient(180deg,#fff,#bae6fd 55%,#0284c7);color:#0c4a6e;text-shadow:none;box-shadow:inset 0 0 0 4px #fff,0 0 14px #e0f2fe}
#choices.eh-thunder .choice:not(.eh-ok){animation:btnJitter .1s linear 8;box-shadow:0 0 0 4px #fde047,0 0 16px #fde047}
#choices.eh-poison .choice:not(.eh-ok){box-shadow:inset 0 0 0 5px #c084fc,inset 0 -16px 0 rgba(88,28,135,.55);background:linear-gradient(180deg,#d8b4fe,#7e22ce)}
#choices.eh-vine .choice:not(.eh-ok),#choices.eh-poison.shade-vine .choice:not(.eh-ok){box-shadow:inset 0 0 0 5px #22c55e,inset 0 -16px 0 rgba(22,101,52,.65);background:linear-gradient(180deg,#bbf7d0,#15803d)}
#choices.eh-rock .choice:not(.eh-ok){animation:cardShake .28s linear 3;box-shadow:inset 0 0 0 4px #a8a29e}
#choices.eh-sand .choice:not(.eh-ok){background:linear-gradient(180deg,#fde047,#ca8a04);color:#3b2300;text-shadow:none;box-shadow:inset 0 0 18px rgba(120,70,0,.45)}
#choices.eh-steel .choice:not(.eh-ok):nth-child(odd){transform:rotate(-7deg)}
#choices.eh-steel .choice:not(.eh-ok):nth-child(even){transform:rotate(6deg)}
#choices.eh-steel .choice:not(.eh-ok){box-shadow:inset 0 0 0 4px #e5e7eb,0 0 10px #fff}
#choices.eh-water .choice:not(.eh-ok){background:linear-gradient(180deg,#7dd3fc,#1d4ed8);box-shadow:inset 0 -16px 0 rgba(14,165,233,.7),0 0 12px #38bdf8}
#choices.eh-dark .choice:not(.eh-ok){animation:fadeShadow 1.05s ease-in-out;background:linear-gradient(180deg,#4c1d95,#1e1b4b)}
#choices.eh-light .choice:not(.eh-ok){animation:ehFlash 1.05s ease-out;box-shadow:0 0 0 4px #fff,0 0 18px #fff}
#choices.eh-star .choice:not(.eh-ok){box-shadow:inset 0 0 0 4px #fde68a,0 0 14px #fde68a}
#choices.eh .choice.eh-ok{animation:none!important;transform:none!important;filter:none!important;opacity:1!important;background:linear-gradient(180deg,#fff,#e0f2fe)!important;color:#0f172a!important;text-shadow:none!important;box-shadow:0 0 0 4px #fff,0 6px 0 #0369a1!important;z-index:5}
#choices.eh .choice.eh-wrong{opacity:1;color:#fff}
.choice.eh-wrong.shade-ball::after,.choice.eh-wrong.shade-meteor::after{content:"";position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;pointer-events:none;z-index:2}
.choice.eh-wrong.shade-ball::after{background:radial-gradient(circle,#fff 0 16%,#ffb020 38%,#ff3b00 66%,transparent 70%);box-shadow:0 0 16px #ff6a00;animation:bitUp .8s ease-out}
.choice.eh-wrong.shade-meteor::after{width:22px;height:22px;border-radius:40% 40% 50% 50%;background:radial-gradient(circle,#fff,#fb923c 60%,#7c2d12);box-shadow:-18px 16px 0 -2px rgba(253,224,71,.95),-10px 8px 0 -1px #fff;transform:rotate(-28deg)}
@keyframes btnJitter{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}100%{transform:translate(0,0)}}
@keyframes fadeShadow{0%,100%{filter:none;opacity:1}35%,60%{filter:brightness(.18);opacity:.4}}
.disrupt{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .35s}
.disrupt.on{opacity:0}
.disrupt.fire{background:
  radial-gradient(ellipse at 12% 88%,rgba(255,100,20,.72),transparent 42%),
  radial-gradient(ellipse at 88% 92%,rgba(255,60,0,.6),transparent 40%),
  linear-gradient(180deg,transparent 45%,rgba(255,120,40,.45))}
.disrupt.fire::before,.disrupt.fire::after{content:"";position:absolute;width:38%;height:34%;bottom:-4%;border-radius:50% 50% 40% 40%;background:rgba(255,140,40,.55);filter:blur(2px);animation:flicker .35s ease-in-out infinite alternate}
.disrupt.fire::before{left:4%}.disrupt.fire::after{right:6%;animation-delay:.15s}
.disrupt.ice{background:
  linear-gradient(135deg,rgba(186,230,253,.52),transparent 40%),
  linear-gradient(225deg,rgba(125,211,252,.45),transparent 45%);
  box-shadow:inset 0 0 48px rgba(186,230,253,.48)}
.disrupt.ice::before{content:"";position:absolute;inset:6px;border:2px solid rgba(186,230,253,.65);border-radius:18px;pointer-events:none}
.disrupt.thunder{background:transparent}
.disrupt.thunder.on{animation:thflash 1.6s steps(2,jump-none) infinite}
@keyframes thflash{0%,70%{opacity:.22;background:rgba(255,240,100,.14)}80%{opacity:.95;background:rgba(255,250,180,.48)}100%{opacity:.28}}
.disrupt.shadow{background:
  radial-gradient(ellipse at 80% 70%,rgba(70,0,110,.75),transparent 52%),
  radial-gradient(ellipse at 15% 85%,rgba(0,0,0,.58),transparent 45%),
  linear-gradient(180deg,rgba(40,0,70,.22),rgba(10,0,25,.4))}
.disrupt.shadow::after{content:"";position:absolute;right:-10%;bottom:-20%;width:55%;height:70%;background:rgba(35,0,60,.65);border-radius:60% 40% 50% 50%;filter:blur(8px);animation:mfloat 2.2s ease-in-out infinite alternate}
.disrupt.rock{background:
  radial-gradient(ellipse at 50% 100%,rgba(120,100,80,.52),transparent 55%),
  radial-gradient(circle at 18% 78%,rgba(90,70,50,.58) 0 8px,transparent 9px),
  radial-gradient(circle at 78% 82%,rgba(90,70,50,.52) 0 10px,transparent 11px),
  radial-gradient(circle at 52% 88%,rgba(110,90,70,.58) 0 7px,transparent 8px)}
.cinema{position:absolute;inset:0;z-index:30;display:none;pointer-events:none;overflow:hidden}
.cinema.on{display:block}
.cinema .cine-dim{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:cinedim .45s ease-out}
.cinema .cine-letter{position:absolute;left:0;right:0;height:11%;background:#000;box-shadow:0 0 24px #000}
.cinema .cine-letter.top{top:0;animation:cinebarT .5s ease-out}.cinema .cine-letter.bot{bottom:0;animation:cinebarB .5s ease-out}
.cinema .cine-cap{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:2;font-weight:900;font-size:clamp(18px,4.5vw,28px);color:#ffe14d;text-shadow:2px 2px 0 #7c1d1d,0 0 16px rgba(255,255,255,.6);white-space:nowrap;letter-spacing:1px;animation:cinecap .7s ease-out}
@keyframes cinedim{from{opacity:0}to{opacity:1}}
@keyframes cinebarT{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes cinebarB{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes cinecap{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.battle-cine #panel{opacity:.25;filter:blur(2px);transition:opacity .3s}
.battle-cine .stagehud,.battle-cine #combo{opacity:.35}
.qrow{display:flex;align-items:center;justify-content:center;gap:.16em;font-weight:900;font-size:clamp(44px,13vw,80px);line-height:1;white-space:nowrap}
#battle.mode-mixed .qrow{font-size:clamp(30px,8.4vw,56px)}
.q-extra[hidden]{display:none}
.qrow .x{color:#ffd84d}
.ansbox{min-width:1.9em;padding:0 .18em;border-radius:16px;background:#fff;color:#1e1b4b;text-align:center;box-shadow:inset 0 -5px 0 #cbd5e1;border:4px solid #ffd84d}
.ansbox.empty{color:#a5b0c8}
.ansbox.good{background:#7dffb2;border-color:#16a34a}
.ansbox.bad{background:#ffb4b4;border-color:#dc2626;animation:wobble .4s}
@keyframes wobble{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.hint{flex:0 0 auto;min-height:0;border-radius:14px;padding:4px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-weight:900;font-size:clamp(15px,3.6vw,20px);line-height:1.25}
.hint .c{color:#ffe14d;font-size:1.2em;letter-spacing:2px}
.hint.good{background:rgba(34,197,94,.25);border:2px solid rgba(125,255,178,.6)}
.hint.bad{background:rgba(255,190,60,.18);border:2px solid rgba(255,216,77,.7)}
.hint.idle{color:#c7d2fe;font-weight:700}
.keypad{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(46px,1fr));gap:8px}
.key{border:0;border-radius:18px;height:auto;min-height:46px;font-size:clamp(30px,7.8vw,46px);font-weight:900;background:linear-gradient(180deg,#ffffff,#dfe6f5);color:#1e1b4b;box-shadow:0 5px 0 #8e9ab8;transition:transform .06s}
.key:active,.key.press{transform:translateY(4px);box-shadow:0 1px 0 #8e9ab8}
.key.del{background:linear-gradient(180deg,#ffd0d0,#ffa3a3);box-shadow:0 5px 0 #c26060;display:grid;place-items:center}
.key.del svg{width:36px;height:36px}
.key.ok{background:linear-gradient(180deg,#ffe14d,#ff9d00);color:#5a1e00;box-shadow:0 5px 0 #a84f00;font-size:clamp(22px,5.5vw,30px)}
.choices{display:none;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(58px,1fr));gap:10px;width:100%;max-width:560px;margin:0 auto;flex:1 1 auto;min-height:0;align-content:stretch}
#battle.mode-choice .keypad{display:none}
#battle.mode-choice .choices{display:grid}
.choice{border:0;border-radius:18px;height:auto;min-height:58px;font-size:clamp(34px,9vw,56px);font-weight:900;background:linear-gradient(180deg,#8fd3ff,#3b82f6);color:#fff;box-shadow:0 5px 0 #1e3a8a;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.choice:nth-child(2){background:linear-gradient(180deg,#ffb3d9,#ec4899);box-shadow:0 6px 0 #831843}
.choice:nth-child(3){background:linear-gradient(180deg,#b7f5a8,#22c55e);box-shadow:0 6px 0 #14532d}
.choice:nth-child(4){background:linear-gradient(180deg,#ffe08a,#f59e0b);box-shadow:0 6px 0 #7c4a03}
.choice:active{transform:translateY(4px)}
.choice.x{opacity:.3;filter:grayscale(1)}
.choice.right{outline:5px solid #fff;animation:pulse .4s ease-in-out 3 alternate}
/* Option C gives the arena more height. Answers shrink a little so the sum stays fully on screen. */
#battle.stage-c .panel{gap:6px;padding:6px 8px 8px}
#battle.stage-c .qcard{padding:6px 6px 8px}
#battle.stage-c .qrow,
#battle.stage-c.mode-mixed .qrow{font-size:clamp(40px,11.2vw,68px)}

/* v3 怪獸圖鑑 — final_07 左右分欄 */

.dex-panel-body{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;animation:dexPanelIn .28s ease-out}
@keyframes dexPanelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dex-panel-art{width:100%;display:flex;flex-direction:column;align-items:center;margin:0 auto 4px}
.dex-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.dex-shot{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:visible;min-width:0}
.dex-shot .dimg{width:100%;height:clamp(140px,30vh,200px);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.dex-shot .mon-raster{width:auto;height:100%;max-width:100%;display:flex;align-items:flex-end;justify-content:center}
.dex-shot .mon-img{width:auto!important;height:auto!important;max-width:100%;max-height:100%;object-fit:contain!important;object-position:center bottom}
.dex-shot figcaption{display:none}
.dex-elem{margin-top:4px;font-weight:900;font-size:15px;color:#ffe14d;background:rgba(0,0,0,.28);border-radius:999px;padding:2px 12px;border:1px solid rgba(255,255,255,.2)}
.ds-art .dex-pair{width:min(100%,420px);margin:0 auto}
.ds-art{overflow:hidden}
.ds-art .dex-shot .dimg{height:clamp(160px,32vh,220px);overflow:hidden}
/* 虛幻魔 idle is 144×360 and the attack plate is 360×360. width/height auto plus
   object-fit contain keeps both aspects — do not force the narrow plate into a wide box. */
.star-picks{display:flex;flex-direction:column;gap:12px;width:min(100%,420px);margin-top:8px}
.star-pick{border:3px solid rgba(255,255,255,.85);border-radius:22px;padding:14px 16px;background:linear-gradient(180deg,#fde68a,#f59e0b);color:#3b2300;font-weight:900;box-shadow:0 6px 0 #92400e;display:flex;flex-direction:column;gap:2px;min-height:72px}
.star-pick b{font-size:clamp(22px,5vw,30px)}
.star-pick span{font-size:clamp(15px,3.6vw,18px);font-weight:800}
.star-pick:nth-child(2){background:linear-gradient(180deg,#fdba74,#ea580c)}
.star-pick:nth-child(3){background:linear-gradient(180deg,#fca5a5,#dc2626);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.star-pick:active{transform:translateY(4px);box-shadow:0 2px 0 #92400e}
.dex-panel-art .mon-raster,.dex-panel-art svg{max-width:100%}
.dex-panel-art .mon-img{object-fit:contain;object-position:center bottom}
.dex-panel-art *{animation:none!important}
.dex-panel-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:2px 0 4px}
.dex-panel-tags i{font-style:normal;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.dex-panel-tags .f{background:rgba(56,189,248,.22);color:#bae6fd}
.dex-panel-tags .b{background:rgba(168,85,247,.28);color:#e9d5ff}
.dex-panel-name{margin:0;font-size:clamp(22px,4.5vw,28px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.dex-panel-nick{font-weight:900;color:#ffe14d;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4);margin-bottom:4px}
.dex-bars{width:100%;display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.dex-bar{display:grid;grid-template-columns:36px 1fr 38px;gap:6px;align-items:center;font-size:12px;font-weight:900}
.dex-bar span:last-child{text-align:right;opacity:.85;font-variant-numeric:tabular-nums}
.dex-bar i{display:block;height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.dex-bar i b{display:block;height:100%;width:var(--p,40%);border-radius:inherit;background:linear-gradient(90deg,#4ade80,#22c55e);box-shadow:0 0 8px rgba(74,222,128,.45)}
.dex-bar i.r b{background:linear-gradient(90deg,#fb7185,#ef4444);box-shadow:0 0 8px rgba(239,68,68,.4)}
.dex-bar i.o b{background:linear-gradient(90deg,#fbbf24,#f59e0b);box-shadow:0 0 8px rgba(251,191,36,.4)}
.dex-panel-lore{margin:0 0 10px;width:100%;text-align:left;line-height:1.5;font-size:13px;color:#e8ecff;background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);max-height:7.5em;overflow-y:auto}
.dex-panel .btn{width:100%;margin-top:2px}
.rdex{margin:4px auto 2px;padding:4px 12px;border-radius:12px;background:rgba(125,255,178,.18);color:#7dffb2;font-weight:900;display:inline-block}
@media (max-width:859px){
  .dex-layout{grid-template-columns:1fr;gap:12px}
  .dex{max-height:none;overflow:visible}
  .dex-panel{position:static;min-height:0;order:-1}
  .dex-panel-art{width:100%}
}
#dsArt .mon-raster,#dsArt .mon-img{max-width:100%;object-fit:contain;object-position:center bottom}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero-bob,.mon-bob,#battle .mon-bob{animation:none}
  #battle .mon-bob{transform:scale(var(--pop,1.05))}
}

/* ---------- 九因歌 chant（跟傳統九因歌表） ---------- */
const DIG = '零一二三四五六七八九';
function cnNum(n){
  if(n<10) return DIG[n]; if(n===100) return '一百';
  if(n>100){ const h=Math.floor(n/100), rest=n%100; return DIG[h]+'百'+(rest?(rest<10?'零'+DIG[rest]:cnNum(rest)):''); }
  const t=Math.floor(n/10), u=n%10;
  /* 九因歌讀法：10–19 用「一十／一十二」，唔好讀「十二」 */
  if(t===1) return '一十'+(u?DIG[u]:'');
  return DIG[t]+'十'+(u?DIG[u]:'');
}
function chant(a,b){
  if(a>9||b>9) return cnNum(a)+'乘'+cnNum(b)+'等於'+cnNum(a*b);
  const p=a*b, left=DIG[a]+DIG[b];
  if(a===3 && b===3) return '三三歸九';
  if(p===10 && ((a===2&&b===5)||(a===5&&b===2))) return left+'得一十';
  if(p===20 && ((a===4&&b===5)||(a===5&&b===4))) return left+'中二十';
  if(p===30 && ((a===5&&b===6)||(a===6&&b===5))) return left+'中三十';
  if(p===40 && ((a===5&&b===8)||(a===8&&b===5))) return left+'中四十';
  if(p<10) return left+'如'+DIG[p];
  return left+cnNum(p);
}
window.__chant = chant;

  if(ok){ f.c++; f.s++; f.p=Math.max(0,f.p-1); } else { f.w++; f.s=0; f.p=Math.min(6,f.p+2); }
  f.t=Date.now(); DATA.stats.answered++; save(); }

  const items=[]; let total=0;
  tables.forEach(t=>{ for(let b=1;b<=9;b++){ const k=t+'x'+b; const f=DATA.facts[k]; let w = f ? 1+(f.p||0)*1.5 : 1.3;
    if(f && f.s>=3) w*=.5; if(b===1||t===1) w*=.55; if(recent.indexOf(k)>=0) w*=.02; items.push([t,b,w]); total+=w; } });
  let r=Math.random()*total; for(const it of items){ r-=it[2]; if(r<=0) return {a:it[0],b:it[1]}; }
  const it=items[items.length-1]; return {a:it[0],b:it[1]};
}
function makeChoices(a,b){ const ans=a*b; const set=[ans];
  const c=shuffle([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,ans+a,ans-a,ans+2]);
  for(const v of c){ if(set.length>=4) break; if(v>0 && set.indexOf(v)<0) set.push(v); }
  while(set.length<4){ const v=randi(1,90); if(set.indexOf(v)<0) set.push(v); }
  return shuffle(set); }

function crossfadeHero(img, src){
  if(!img || img.getAttribute('src')===src) return;
  const art=img.parentElement;
  if(art && img.getAttribute('src')){
    const old=img.cloneNode(false);
    old.removeAttribute('onerror');
    old.classList.add('hero-fade');
    art.appendChild(old);
    requestAnimationFrame(function(){ old.classList.add('out'); });
    setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); }, 520);
  }
  img.setAttribute('src', src);
}

function applyDexPack(pack){
  if(!pack || !pack.monsters) return;
  const order=[];
  pack.monsters.forEach(function(row){
    const id=row.asset, m=MONS[id]; if(!m) return;
    m.name=row.name; m.short=row.name; m.nick=row.move; m.kind=row.kind; m.habitat=row.place;
    m.lore=row.desc_mid; m.kid=row.desc_kid;

function heroPose(p){

function syncHenshin(){
  const h=heroSvgEl(); if(!h) return;
  const st=henshinStage(), prev=B._hen||1;
  for(let i=1;i<=5;i++) h.classList.toggle('henshin-'+i, i===st);
  const bob=$('#heroBob');
  const img=h.querySelector('.hero-raster');
  if(img && !(bob&&bob.dataset.svgFallback)){
    const next=heroSrc(st,'idle');
    if(st>prev) crossfadeHero(img, next);
    else if(img.getAttribute('src')!==next) img.setAttribute('src', next);
  }
  if(isClockMode()) B.maxHen=Math.max(B.maxHen||1, st);
  const nameEl=$('#formName');
  if(nameEl){
    nameEl.textContent=HEN_LABEL[st]||HEN_LABEL[1];
    nameEl.hidden=false;
    if(st>prev){ nameEl.classList.remove('flash'); void nameEl.offsetWidth; nameEl.classList.add('flash'); }
  }
  if(st>prev){
    B._henLabel=HEN_LABEL[st];
    h.classList.add('henshin-up');
    preloadForm(Math.min(5, st+1));
    try{ const hp=relPos(mk('.mk-chest',heroWrap));

}

function paintElemBits(host, kind){
  if(!host) return;
  const n = (kind==='fire'||kind==='star'||kind==='ice'||kind==='sand') ? 12 : 8;
  for(let i=0;i<n;i++){
    const s=document.createElement('i');
    s.className='ebit ebit-'+kind;
    s.style.left=(6+Math.random()*88)+'%';
    s.style.top=(8+Math.random()*78)+'%';
    s.style.animationDelay=(Math.random()*0.28)+'s';
    host.appendChild(s);
  }
}
function playElementHit(wrongBtn){
  clearElementHit();
  const info=elemOf(B.type);
  const card=$('#qCard'); if(!card) return;
  card.classList.add('eh','eh-'+info.kind,'shade-'+info.shade);
  paintElemBits(card, info.kind);
  const choices=$('#choices');
  if(choices && $$('.choice', choices).length){
    choices.classList.add('eh','eh-'+info.kind,'eh-'+info.shade,'shade-'+info.shade);
    $$('.choice', choices).forEach(function(b){
      const correct=B.q && String(b.dataset.v)===String(B.q.ans);
      if(correct) b.classList.add('eh-ok');
      else paintElemBits(b, info.kind);

  if(pop){
    pop.textContent=info.word+'！';
    pop.className='elem-pop show pop-'+info.kind;

  else if(info.kind==='thunder') Sfx.shing();

}

function syncChestLight(){
  const h=heroSvgEl();
  const wrongs=B.rwrong||0; let col='#38d6cf', blink=false, comboCls='';
  if(wrongs>=3){ col='#ef4444'; blink=true; }

  else if(B.combo>=6){ col='#ff7ad9'; blink=true; comboCls='combo-omega'; }
  else if(B.combo>=5){ col='#ffe14d'; blink=true; comboCls='combo-rainbow'; }

/* Standing omega body, as a fraction of the square pose canvas. */
const HERO_STAND = {1:0.50,2:0.56,3:0.54,4:0.55,5:0.56};
function layoutStage(){ if(!stageEl) return; const w=stageEl.clientWidth, h=stageEl.clientHeight; if(!w||!h) return;
  /* Grow fighters with the stage until the phone width or the HUD clearance stops them.
     The question lives in the panel under the stage, so it is never covered by the arena. */
  const frac=HERO_STAND[henshinStage()]||0.54;
  let heroVis=Math.max(78, h*0.40);
  let monVis=heroVis*1.1;
  let heroBox=heroVis/frac;
  const need=heroBox+monVis;
  const room=w*0.96+Math.min(48, w*0.12);
  const maxH=h*0.72;
  let s=1;
  if(need>room) s=Math.min(s, room/need);
  if(heroBox>maxH) s=Math.min(s, maxH/heroBox);
  if(s<1){ heroVis*=s; monVis=heroVis*1.1; heroBox=heroVis/frac; }
  heroWrap.style.height=Math.round(heroBox)+'px'; heroWrap.style.width=Math.round(heroBox)+'px';
  monWrap.style.height=Math.round(monVis)+'px'; monWrap.style.width=Math.round(monVis)+'px'; }

function divisionDivisors(star){ if(star>=3) return [6,7,8,9]; if(star===2) return [2,3,4,5,10]; return [2,5,10]; }
function divisionOrder(star){

function pickDivision(divisors, qMax, recent){
  const items=[]; let total=0;
  divisors.forEach(function(d){ for(let q=1;q<=qMax;q++){ const k='div:'+d+'x'+q; const f=DATA.facts[k];
    let w=f?1+(f.p||0)*1.5:1.2; if(f&&f.s>=3) w*=.5; if(recent.indexOf(k)>=0) w*=.02;
    items.push([d,q,w,k]); total+=w; } });
  let r=Math.random()*total;
  for(const it of items){ r-=it[2]; if(r<=0) return {d:it[0],q:it[1],dividend:it[0]*it[1],key:it[3]}; }
  const it=items[items.length-1]; return {d:it[0],q:it[1],dividend:it[0]*it[1],key:it[3]};
}
function makeDivChoices(quot){
  const set=[quot];
  const cands=shuffle([quot+1,quot-1,quot+2,quot-2,quot+3,quot-3,quot+4,quot-4]);
  for(const v of cands){ if(set.length>=4) break; if(v>=1 && set.indexOf(v)<0) set.push(v); }
  let guard=0;
  while(set.length<4 && guard++<40){ const v=randi(1, Math.max(12, quot+3)); if(v>=1 && set.indexOf(v)<0) set.push(v); }
  return shuffle(set);
}

function factLine(q){

    return cnNum(q.a)+'乘'+cnNum(q.b)+(opWord[q.op2]||'')+cnNum(q.c)+'等於'+cnNum(q.ans);

function factorPair(prod){
  const pairs=[];
  for(let a=2;a<=10;a++){
    if(prod%a===0){ const b=prod/a; if(b>=1 && b<=10 && b=== (b|0)) pairs.push([a,b]); }
  }
  return pairs.length ? pick(pairs) : null;
}
function pickMixed(star){
  for(let guard=0; guard<80; guard++){
    if(star<=1){
      const a=randi(2,5), b=randi(2,5), c=randi(1,6);
      const ans=a*b+c;
      if(ans>=1 && ans<=20) return {a:a,b:b,c:c,op2:'+',ans:ans};
    } else if(star===2){
      const a=randi(2,6), b=randi(2,6), prod=a*b, minus=Math.random()<0.5;
      if(minus){
        if(prod<2) continue;
        const c=randi(1, Math.min(9, prod-1));
        const ans=prod-c;
        if(ans>=1 && ans<=30) return {a:a,b:b,c:c,op2:'−',ans:ans};
      } else {
        const c=randi(1,9), ans=prod+c;
        if(ans>=1 && ans<=30) return {a:a,b:b,c:c,op2:'+',ans:ans};
      }
    } else {
      const kind=pick(['+','−','×','÷','+','÷']);
      if(kind==='÷'){
        const c=pick([2,3,4,5,6,8,9,10]);
        const quot=randi(1,12);
        const prod=quot*c;
        if(prod>50) continue;
        const pair=factorPair(prod);
        if(!pair) continue;
        return {a:pair[0],b:pair[1],c:c,op2:'÷',ans:quot};
      }
      if(kind==='×'){
        const a=randi(2,5), b=randi(2,5), c=randi(2,4);
        const ans=a*b*c;
        if(ans>=1 && ans<=50) return {a:a,b:b,c:c,op2:'×',ans:ans};
      } else if(kind==='−'){
        const a=randi(2,9), b=randi(2,6), prod=a*b;
        if(prod<2 || prod>50) continue;
        const c=randi(1, Math.min(9, prod-1));
        return {a:a,b:b,c:c,op2:'−',ans:prod-c};
      } else {
        const a=randi(2,8), b=randi(2,6), c=randi(1,9);
        const ans=a*b+c;
        if(ans>=1 && ans<=50) return {a:a,b:b,c:c,op2:'+',ans:ans};
      }
    }
  }
  return {a:2,b:3,c:4,op2:'+',ans:10};
}
function makeMixedChoices(q){
  const ans=q.ans, prod=q.a*q.b;
  const set=[ans];
  const cands=[ans+1,ans-1,ans+2,ans-2,prod,ans+3,ans-3,q.a+q.b+q.c];
  if(q.op2==='+') cands.push(prod-q.c, q.a*q.b*q.c);
  if(q.op2==='−') cands.push(prod+q.c);
  if(q.op2==='×') cands.push(prod+q.c, prod*q.c+1);
  if(q.op2==='÷') cands.push(prod, ans+q.c, q.a+q.b);
  shuffle(cands).forEach(function(v){
    if(set.length>=4) return;
    if(v>=0 && v===(v|0) && set.indexOf(v)<0) set.push(v);
  });
  let guard=0;
  while(set.length<4 && guard++<40){
    const v=Math.max(0, ans+randi(-6,6));
    if(set.indexOf(v)<0) set.push(v);
  }
  return shuffle(set);
}

    if(B.paused || B.busy){ if(!B._freezeAt) B._freezeAt=Date.now(); return; }
    if(B._freezeAt){ B.endAt+=Date.now()-B._freezeAt; B._freezeAt=0; }

function pressKey(k){ const b=$('#keypad .key[data-k="'+k+'"]'); if(!b) return; b.classList.add('press'); setTimeout(()=>b.classList.remove('press'),110); }
function runSelfTest(){
  const fails=[];
  const saved=B.combo;
  [[0,1],[1,2],[2,2],[3,3],[4,3],[5,4],[6,5],[9,5]].forEach(function(pair){
    B.combo=pair[0]; if(henshinStage()!==pair[1]) fails.push('hen '+pair[0]+'→'+henshinStage());
  });
  B.combo=saved;
  const words={heidragon:'火',lavaover:'火',phoenix:'火',flamecrab:'火',holyturt:'冰',icetiran:'冰',thundwolf:'雷',deathscorp:'毒',manflower:'毒',mtngod:'岩',sandwyrm:'沙',steeltiran:'鋼',seaking:'水',ninjacat:'暗',nightmare:'暗',illusdemon:'光',galmoth:'星',starlord:'星'};
  Object.keys(words).forEach(function(id){
    const m=MONS[id];
    if(!m) fails.push('missing '+id);
    else if(m.elemWord!==words[id]) fails.push(id+' elem '+(m.elemWord||''));
    if(m && m.name!==({'deathscorp':'死神蠍','sandwyrm':'黃泉魔龍'}[id]||m.name)) fails.push(id+' name');
  });
  if(MONS.deathscorp.name!=='死神蠍') fails.push('deathscorp name');
  if(MONS.sandwyrm.name!=='黃泉魔龍') fails.push('sandwyrm name');
  const bob=$('#monBob');
  Object.keys(words).forEach(function(id){
    bob.innerHTML=monRasterHTML(id);
    B.type=id;
    setMonAttack(false);
    let host=$('#monBob .mon');
    if(!host || host.classList.contains('idle-flip') || host.classList.contains('atk-flip')) fails.push('idle flip '+id);
    setMonAttack(true);
    host=$('#monBob .mon');
    const img=$('#monBob .mon-img');
    if(!host || host.classList.contains('atk-flip') || host.classList.contains('idle-flip')) fails.push('atk flip '+id);
    if(!img || img.getAttribute('src')!==monAttackSrc(id)) fails.push('atk src '+id);
    const tr=getComputedStyle(img).transform||'';
    if(/matrix\(\s*-/.test(tr)) fails.push('atk mirror '+id);
  });
  bob.innerHTML='';
  if(/scaleX\(\s*-1/.test(setMonAttack.toString()+mvWhirl.toString())) fails.push('runtime scaleX(-1)');
  Array.from(document.styleSheets).forEach(function(sheet){
    let rules; try{ rules=sheet.cssRules; }catch(e){ return; }
    Array.from(rules).forEach(function(rule){
      const t=rule.cssText||'';
      if(/scaleX\(\s*-1/.test(t) && /\.(mon|hero)/.test(t)) fails.push('css flip');
    });
  });
  [1,2,3].forEach(function(star){
    const divs=divisionDivisors(star);
    if(star===1 && divs.join(',')!=='2,5,10') fails.push('star1');
    if(star===2 && divs.join(',')!=='2,3,4,5,10') fails.push('star2');
    if(star===3 && divs.join(',')!=='6,7,8,9') fails.push('star3');
    const qMax=star>=3?12:9;
    for(let n=0;n<12;n++){
      const order=divisionOrder(star);
      if(order.length!==5) fails.push('order '+star);
      if(star>=3 && (order.indexOf('heidragon')<0 || order.indexOf('starlord')<0)) fails.push('bosses');
      const picked=pickDivision(divs, qMax, []);
      if(!picked || picked.dividend!==picked.d*picked.q || picked.q<1 || picked.q>qMax || divs.indexOf(picked.d)<0) fails.push('fact '+star);
      const ch=makeDivChoices(picked.q);
      if(ch.length!==4 || ch.indexOf(picked.q)<0 || ch.some(function(v){ return v<1 || v!==(v|0); })) fails.push('choices '+star);
    }
  });
  [1,2,3].forEach(function(star){
    let sawDiv=false, sawMul=false, sawMinus=false;
    for(let n=0;n<40;n++){
      const q=pickMixed(star);
      const prod=q.a*q.b;
      let ans=prod;
      if(q.op2==='+') ans=prod+q.c;
      else if(q.op2==='−') ans=prod-q.c;
      else if(q.op2==='×') ans=prod*q.c;
      else if(q.op2==='÷') ans=prod/q.c;
      if(ans!==q.ans || q.ans!==(q.ans|0) || q.ans<0) fails.push('mix eval '+star+' '+q.a+q.op2+q.c);
      const cap=star<=1?20:star===2?30:50;
      if(q.ans>cap) fails.push('mix cap '+star+' '+q.ans);
      if(star<=1 && q.op2!=='+') fails.push('star1 op');
      if(star===2 && q.op2!=='+' && q.op2!=='−') fails.push('star2 op');
      if(q.op2==='÷'){ sawDiv=true; if(prod%q.c!==0) fails.push('mix div'); }
      if(q.op2==='×') sawMul=true;
      if(q.op2==='−') sawMinus=true;
      const ch=makeMixedChoices(q);
      if(ch.length!==4 || ch.indexOf(q.ans)<0) fails.push('mix choices');
      const order=divisionOrder(star);
      if(order.length!==5) fails.push('mix order');
      if(star>=3 && (order.indexOf('heidragon')<0||order.indexOf('starlord')<0)) fails.push('mix bosses');
      if(star<3 && (order.indexOf('starlord')>=0)) fails.push('mix early boss');
    }
    if(star>=3 && (!sawDiv || !sawMul)) fails.push('star3 kinds');
    if(star===2 && !sawMinus) fails.push('star2 minus');
  });
  Object.keys(ATTACK_SCALE).forEach(function(id){
    const sc=ATTACK_SCALE[id];
    if(!(sc>=1 && sc<=1.65)) fails.push('scale '+id);
  });
  const pair=dexPairHTML('heidragon');
  if(/立繪|出招|<figcaption/.test(pair)) fails.push('dex caption');

  for(let st=1;st<=5;st++){
    if(heroSrc(st,'idle')!=='assets/battle/hero_h'+st+'.png') fails.push('idle src '+st);
    if(heroSrc(st,'omega')!=='assets/battle/hero_h'+st+'.png') fails.push('omega src '+st);
    if(heroSrc(st,'win')!=='assets/battle/hero_h'+st+'_pose_win.png') fails.push('win src '+st);
    if(heroSrc(st,'punch')!=='assets/battle/hero_h'+st+'_pose_punch.png') fails.push('punch src '+st);
    if(heroSrc(st,'kick')!=='assets/battle/hero_h'+st+'_pose_kick.png') fails.push('kick src '+st);

  }
  ['beam','omega'].forEach(function(p){

    if(!heroWrap || !heroWrap.classList.contains('under-mon')) fails.push('under '+p);
    if(heroWrap && heroWrap.classList.contains('soft-beam')) fails.push('fade '+p);
    const op=parseFloat(getComputedStyle(heroWrap).opacity);
    if(!(op>=0.99)) fails.push('op '+p+' '+op);
    const hz=parseInt(getComputedStyle(heroWrap).zIndex,10), mz=parseInt(getComputedStyle(monWrap).zIndex,10);
    if(!(hz<mz)) fails.push('z '+p+' '+hz+'/'+mz);
    const img=hs && hs.querySelector('.hero-raster');
    if(!img || img.getAttribute('src')!==heroSrc(1,p)) fails.push('live '+p);
  });
  heroPose('omega');
  if(!heroSvgEl() || !heroSvgEl().classList.contains('stand')) fails.push('omega stand');
  heroPose('kick');
  if(!heroWrap || heroWrap.classList.contains('under-mon') || heroWrap.classList.contains('soft-beam')) fails.push('kick under');
  if(heroSvgEl() && heroSvgEl().classList.contains('stand')) fails.push('kick stand');
  if(heroWrap && parseFloat(getComputedStyle(heroWrap).opacity)<0.99) fails.push('kick op');
  if(heroWrap && monWrap){
    const hz=parseInt(getComputedStyle(heroWrap).zIndex,10), mz=parseInt(getComputedStyle(monWrap).zIndex,10);
    if(!(hz>mz)) fails.push('kick z '+hz+'/'+mz);
  }
  heroPose('idle');
  if(heroWrap && (heroWrap.classList.contains('under-mon') || heroWrap.classList.contains('soft-beam'))) fails.push('idle under');
  if(!heroSvgEl() || !heroSvgEl().classList.contains('stand')) fails.push('idle stand');
  if(heroWrap && parseFloat(getComputedStyle(heroWrap).opacity)<0.99) fails.push('idle op');
  const stageNow=currentStageSize();
  if(!$('#battle').classList.contains('stage-'+stageNow)) fails.push('stage '+stageNow);
  const monHud=$('.monhud'), right=$('.hud-right');
  if(!monHud || !right || !right.contains(monHud) || !right.contains($('#combo'))) fails.push('hud right');
  const pre=document.createElement('pre');
  pre.id='selftest';
  pre.textContent=fails.length?fails.join('\n'):'OK';
  document.body.appendChild(pre);
}
if(/[?&]test=1/.test(location.search)) window.__ut = { B:B, force:k=>{ B.forceMove=k; }, gotoRound:i=>{ B.token++; B.round=i; hideResult(); startRound(B.order[i]); }, startRound:t=>{ B.token++; hideResult(); startRound(t); }, show:id=>show(id), dex:list=>{ DATA.dex={}; list.forEach(t=>DATA.dex[t]=1+(t.length%3)); save(); renderProgress(); }, order:o=>{ B.order=o; }, henshinStage, syncHenshin, syncChestLight, chooseMove, applyDisrupt, playElementHit, clearElementHit, isHardFight, setMonAttack, ATTACK_SCALE, divisionDivisors, divisionOrder, pickDivision, makeDivChoices, pickMixed, makeMixedChoices, startSession, renderCombo, layoutStage, monRasterHTML, bindMonImg, openDexDetail, renderProgress, cinematicFinalFinish, heroSrc, poseFile, heroPose, ensureHero, DEX_ORDER, MONS, addTime, FORM_TITLE, isClockMode, data:()=>DATA };
