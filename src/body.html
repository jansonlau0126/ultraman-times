<svg id="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<div id="app">
  <header id="topbar">
    <button id="btnHome" class="iconbtn" aria-label="返主頁" data-icon="home"></button>
    <div class="brand">超人乘數表</div>
    <button id="btnMute" class="iconbtn" aria-label="聲音開關" data-icon="sound"></button>
  </header>
  <main>
    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="home-city" aria-hidden="true"></div>
      <div class="home-glow" aria-hidden="true"></div>
      <div class="home-wrap">
        <h1 class="home-title">超人乘數表</h1>
        <div class="home-stage" id="homeStage">
          <div class="home-sparkles" aria-hidden="true"></div>
          <div class="home-hero" id="homeHero" title="撳我！"></div>
        </div>
        <div class="home-dock">
          <div class="home-pet home-pet-l" id="homePetL"></div>
          <div class="home-menu">
            <button class="home-pill learn" data-go="learnPick">學乘數表</button>
            <button class="home-pill battle" data-go="setup-battle">打怪獸</button>
            <button class="home-pill divide" data-go="divide">除法戰鬥</button>
            <button class="home-pill mixed" data-go="mixed">兩步混合</button>
            <button class="home-pill timed" data-go="setup-survive">限時挑戰</button>
            <button class="home-pill combo" data-go="setup-combo">連擊挑戰</button>
          </div>
          <div class="home-pet home-pet-r" id="homePetR"></div>
          <div class="home-floor-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <button class="home-record" data-go="progress">戰績<small>勳章 · 圖鑑 · 分數</small></button>
      </div>
    </section>

    <!-- LEARN PICK -->
    <section id="learnPick" class="screen">
      <div class="wrap">
        <h2 class="h">揀乘數表</h2>
        <p class="sub">你想學邊個乘數表呀？</p>
        <div class="tiles" id="learnTiles"></div>
      </div>
    </section>

    <!-- LEARN -->
    <section id="learn" class="screen">
      <div class="learn-top">
        <button class="btn small gray" id="lBack"><span data-icon="back"></span>揀過</button>
        <h2><span id="lTitle">2</span> 乘數表</h2>
        <button class="btn small purple" id="lAuto"><span data-icon="play"></span><span class="lbl">自動</span></button>
      </div>
      <div class="learn-main">
        <div class="card lcard">
          <button class="iconbtn speakbtn" id="lSpeak" aria-label="讀出嚟" data-icon="speaker"></button>
          <div class="leq" id="lEq"><span id="lA">2</span><span class="x">×</span><span id="lB">1</span> = <span class="ans" id="lP">2</span></div>
          <div class="lchant" id="lChant">一二得二</div>
          <div class="ldots" id="lDots"></div>
          <div class="dcap" id="lCap"></div>
          <div class="lnav">
            <button class="btn small blue" id="lPrev"><span data-icon="back"></span>上一個</button>
            <div class="lprog" id="lProg"></div>
            <button class="btn small blue" id="lNext">下一個<span data-icon="next"></span></button>
          </div>
          <div class="voicenote" id="voiceNote"></div>
        </div>
        <div class="lside">
          <div class="card llist" id="lList"></div>
          <button class="btn" id="lGo"><span data-icon="bolt"></span>學識喇！去打怪獸</button>
        </div>
      </div>
    </section>

    <!-- SETUP (battle / timed) -->
    <section id="setup" class="screen setup">
      <div class="wrap">
        <h2 class="h" id="setupTitle">打怪獸</h2>
        <p class="sub" id="setupSub">揀你想練習嘅乘數表（可以揀幾個）</p>
        <p class="setup-rules" id="setupRules"></p>
        <div class="tiles" id="setupTiles"></div>
        <div class="row">
          <button class="btn small purple" id="selMix">2至9 混合</button>
          <button class="btn small gray" id="selNone">全部清除</button>
        </div>
        <div class="row" id="modeRow">
          <div class="seg" id="modeSeg">
            <button data-choice="0" aria-pressed="true">自己打答案</button>
            <button data-choice="1" aria-pressed="false">揀答案（易啲）</button>
          </div>
        </div>
        <div class="row">
          <div class="seg" id="speakSeg">
            <button data-speak="1" aria-pressed="true">答錯讀出口訣</button>
            <button data-speak="0" aria-pressed="false">唔讀</button>
          </div>
        </div>
        <div class="besttxt" id="bestTxt"></div>
        <div class="warn" id="setupWarn"></div>
        <button class="btn" id="startBtn"><span data-icon="bolt"></span><span class="lbl">開始打怪獸！</span></button>
      </div>
    </section>

    <!-- MIXED two-step star pick -->
    <section id="mixed" class="screen">
      <div class="wrap">
        <h2 class="h">兩步混合</h2>
        <p class="sub">由左到右計，暫時冇括號。揀一粒星開始。</p>
        <div class="star-picks" id="mixPicks">
          <button class="star-pick" data-star="1"><b>★ 一星</b><span>乘加，答案 ≤ 20</span></button>
          <button class="star-pick" data-star="2"><b>★★ 二星</b><span>乘之後加或者減，≤ 30</span></button>
          <button class="star-pick" data-star="3"><b>★★★ 三星</b><span>再乘或者除得盡，≤ 50</span></button>
        </div>
      </div>
    </section>

    <!-- DIVISION star pick -->
    <section id="divide" class="screen">
      <div class="wrap">
        <h2 class="h">除法戰鬥</h2>
        <p class="sub">除得盡先出招！揀一粒星開始。</p>
        <div class="star-picks" id="starPicks">
          <button class="star-pick" data-star="1"><b>★ 一星</b><span>除以 2、5、10</span></button>
          <button class="star-pick" data-star="2"><b>★★ 二星</b><span>再加 3 同 4</span></button>
          <button class="star-pick" data-star="3"><b>★★★ 三星</b><span>除以 6 至 9</span></button>
        </div>
      </div>
    </section>

    <!-- BATTLE -->
    <section id="battle" class="screen">
      <div class="stage" id="stage">
        <div class="battle-city" aria-hidden="true"></div>
        <div class="ground"></div>
        <div class="stagehud">
          <div class="hudbox herohud" id="heroHud"><i class="chest-lamp" id="chestLamp" aria-hidden="true"></i><div id="roundLbl">第 1 關</div><div class="dots" id="roundDots"></div></div>
          <div class="hud-right">
            <div class="hudbox monhud"><div id="monName">怪獸</div><div class="hpbar"><i id="hpFill"></i></div></div>
            <div class="combo" id="combo">2 連擊</div>
          </div>
        </div>
        <div class="elem-pop" id="elemPop" aria-hidden="true"></div>
        <div class="hero-wrap" id="heroWrap"><div class="hero-bob" id="heroBob"></div><div class="form-name" id="formName">銀光形態</div></div>
        <div class="mon-wrap" id="monWrap"><div class="mon-bob" id="monBob"></div></div>
        <div id="fxLayer"></div>
        <canvas id="fxCanvas"></canvas>
      </div>
      <div class="panel" id="panel">
        <div id="disrupt" class="disrupt" aria-hidden="true"></div>
        <div class="qcard" id="qCard">
          <div class="qrow" id="qRow"><span id="qA">2</span><span class="x" id="qOp">×</span><span id="qB">3</span><span class="x q-extra" id="qOp2" hidden>+</span><span class="q-extra" id="qC" hidden>4</span><span class="eq">=</span><span class="ansbox empty" id="qAns">?</span></div>
        </div>
        <div class="hint idle" id="hint"><div>答啱就可以出招打怪獸！</div></div>
        <div class="keypad" id="keypad"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="overlay" id="result"><div class="card rcard" id="resultCard"></div></div>
      <div id="cinema" class="cinema" aria-hidden="true"></div>
    </section>

    <!-- PROGRESS -->
    <section id="progress" class="screen">
      <div class="wrap">
        <h2 class="h">戰績</h2>
        <p class="sub">打低幾多隻、連擊有幾高，一目瞭然</p>
        <div class="stats stats-primary" id="stats"></div>
        <div class="pcols">
        <div class="pcol">
        <div class="section-t">乘數表地圖</div>
        <div class="mwrap"><table class="mgrid" id="mgrid"></table></div>
        <div class="legend"><span><i style="background:#22c55e"></i>識晒</span><span><i style="background:#facc15"></i>練習緊</span><span><i style="background:#4b5578"></i>未試過</span></div>
        </div>
        <div class="pcol">
        <div class="section-t" id="weakT">要多啲練習</div>
        <div class="weak" id="weak"></div>
        <div class="section-t">我嘅勳章</div>
        <div class="badges" id="badges"></div>
        </div>
        </div>
        <div class="dex-stage">
          <h2 class="dex-title">怪獸圖鑑 <span id="dexCount"></span><span id="dexStamp" class="dex-stamp" hidden>翼光奧米加</span></h2>
          <div class="dex-layout">
            <div class="dex" id="dex"></div>
            <aside class="dex-panel" id="dexPanel" aria-live="polite">
              <div class="dex-panel-empty" id="dexPanelEmpty">撳左邊怪獸睇詳情</div>
              <div class="dex-panel-body" id="dexPanelBody" hidden>
                <div class="dex-panel-art" id="dexPanelArt"></div>
                <div class="dex-panel-tags" id="dexPanelTags"></div>
                <h3 class="dex-panel-name" id="dexPanelName"></h3>
                <div class="dex-panel-nick" id="dexPanelNick"></div>
                <div class="dex-bars" id="dexBars"></div>
                <p class="dex-panel-lore" id="dexPanelLore"></p>
                <button type="button" class="btn small blue" id="dexPanelMore">睇完整資料</button>
              </div>
            </aside>
          </div>
        </div>
        <button class="btn gray small" id="resetBtn"><span data-icon="trash"></span>清除所有進度</button>
      </div>
    </section>
  </main>
</div>

<div id="modal"><div class="card"><p id="mText"></p><div class="mb"><button class="btn small" id="mYes">係</button><button class="btn small green" id="mNo">唔係</button></div></div></div>

<div id="dexSheet" role="dialog" aria-modal="true" aria-labelledby="dsName" hidden>
  <div class="dsheet">
    <div class="ds-bg" id="dsBg" aria-hidden="true"></div>
    <button type="button" class="ds-close" id="dsClose" aria-label="關閉">×</button>
    <div class="ds-art" id="dsArt"></div>
    <div class="ds-body">
      <div class="ds-tags" id="dsTags"></div>
      <h3 class="ds-name" id="dsName"></h3>
      <div class="ds-nick" id="dsNick"></div>
      <div class="ds-meta">
        <div><b>種類</b><span id="dsKind"></span></div>
        <div><b>出沒地</b><span id="dsHabitat"></span></div>
        <div><b>必殺反擊</b><span id="dsMove"></span></div>
        <div><b>紀錄</b><span id="dsRecord"></span></div>
        <div><b>屬性</b><span id="dsElem"></span></div>
      </div>
      <p class="ds-kid" id="dsKid"></p>
      <p class="ds-lore" id="dsLore"></p>
    </div>
  </div>
</div>

<div id="rotateLock" role="dialog" aria-modal="true" aria-label="請轉直個手機">
  <div class="rotate-card">
    <div class="rotate-phone" aria-hidden="true"></div>
    <p>請轉直個手機</p>
    <p class="rotate-sub">直向先好玩到打怪獸</p>
  </div>
</div>
